<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página de exemplo para a aula de publicação de sites com GitHub Pages.">
  <title>Aula de GitHub | UNICID</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    main {
      width: 100%;
      max-width: 580px;
      padding: 48px 36px;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
    }
    .tag { color: #93c5fd; font-weight: bold; letter-spacing: 2px; }
    h1 { font-size: clamp(28px, 5vw, 42px); margin: 16px 0; }
    p { color: #cbd5e1; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #3b82f6;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover, a:focus-visible { background: #2563eb; }
    footer { margin-top: 32px; color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="tag">UNICID • CIÊNCIA DA COMPUTAÇÃO</div>
    <h1>Meu primeiro site publicado!</h1>
    <p>Esta página foi criada para praticar HTML, Git, GitHub Actions e a publicação automática com GitHub Pages.</p>
    <a href="https://github.com/Marcuss9/AulaGithubDesignProfissional---UNICID" target="_blank" rel="noopener noreferrer">Ver repositório no GitHub</a>
    <footer>Projeto demonstrativo para aula de publicação no GitHub.</footer>
  </main>
</body>
</html>
